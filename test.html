<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Date With Me? ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #4a2631;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      padding: 35px 28px;
      box-shadow: 0 20px 50px rgba(80, 20, 40, 0.25);
      text-align: center;
    }

    .heart {
      font-size: 65px;
      animation: heartbeat 1.4s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
    }

    h1 {
      margin: 10px 0;
      color: #e63967;
      font-size: 34px;
    }

    .subtitle {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 600;
      margin: 17px 0 7px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 2px solid #ffd0da;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fff8fa;
      color: #4a2631;
    }

    input:focus,
    select:focus {
      border-color: #ff5d7d;
    }

    .submit-btn {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff477e, #e91e63);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(233, 30, 99, 0.4);
    }

    .message {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: #fff0f4;
      color: #d6335c;
      font-weight: 600;
      line-height: 1.5;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #98717b;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">❤️</div>

    <h1>Will You Go On A Date With Me?</h1>

    <p class="subtitle">
      Hey beautiful! 🥰<br>
      I'd really love to spend some time with you.
      Pick a place, a date, and a time that works for you! 💕
    </p>

    <form id="dateForm">

      <label for="name">What's your name? 💕</label>
      <input
        type="text"
        id="name"
        placeholder="Type your name here..."
        required
      >

      <label for="place">Where should we go? 📍</label>
      <select id="place" required>
        <option value="">Choose a place...</option>
        <option>Romantic Dinner 🍝</option>
        <option>Coffee Date ☕</option>
        <option>Movie Date 🎬</option>
        <option>Beach Date 🌊</option>
        <option>Mall & Food Trip 🛍️</option>
        <option>Park & Picnic 🌳</option>
        <option>Surprise Me! 💝</option>
      </select>

      <label for="date">When should we go? 📅</label>
      <input type="date" id="date" required>

      <label for="time">What time should we go? ⏰</label>
      <select id="time" required>
        <option value="">Choose a time...</option>
        <option>10:00 AM</option>
        <option>11:00 AM</option>
        <option>12:00 PM</option>
        <option>1:00 PM</option>
        <option>2:00 PM</option>
        <option>3:00 PM</option>
        <option>4:00 PM</option>
        <option>5:00 PM</option>
        <option>6:00 PM</option>
        <option>7:00 PM</option>
        <option>8:00 PM</option>
      </select>

      <button type="submit" class="submit-btn">
        💌 Send My Date Choice
      </button>

    </form>

    <div class="message" id="message">
      💕 Thank you! Your date choice is ready to send.
      <br><br>
      Your email app should open so you can send it to me. ❤️
    </div>

    <div class="footer">
      Made with ❤️ just for you
    </div>

  </div>

  <script>
    const form = document.getElementById("dateForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;
      const place = document.getElementById("place").value;
      const date = document.getElementById("date").value;
      const time = document.getElementById("time").value;

      const formattedDate = new Date(date + "T00:00:00")
        .toLocaleDateString("en-US", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        });

      const subject = encodeURIComponent(
        "💕 Date Request from " + name
      );

      const body = encodeURIComponent(
        "Hey! ❤️\n\n" +
        name + " would like to go on a date with you! 🥰\n\n" +
        "📍 Where: " + place + "\n" +
        "📅 Date: " + formattedDate + "\n" +
        "⏰ Time: " + time + "\n\n" +
        "Looks like we have a date! 💕"
      );

      window.location.href =
        "mailto:rcag050795@gmail.com?subject=" +
        subject +
        "&body=" +
        body;

      message.style.display = "block";
    });
  </script>

</body>
</html>
